name: Issue workflow

on:
  issues:
    types: [opened]

jobs:
  print-issue-info:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Print issue title and assignee
        run: |
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Assignee: ${{ github.event.issue.assignee.login }}"
          
      - name: Add issue to README
        run: |
          echo "- ${{ github.event.issue.title }} - ${{ github.event.issue.assignee.login }}" >> README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add new issue to README"
          git push
